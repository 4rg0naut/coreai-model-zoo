# LFM2.5-1.2B Neural Engine recipe (S6): 8-bit k-means palettization, per-grouped-channel group 32,
# embeddings excluded exactly as Apple's iOS presets do (the tied table is int8-quantized per tensor
# on iOS and reused as the head). Identical shape to minicpm5_pal8_g32.yaml (the 1B's shipped ANE recipe);
# the depthwise conv taps are a bare parameter in the iOS builder and are never palettized.
kmeans_palettization_config:
  global_config:
    op_state_spec:
      weight:
        n_bits: 8
        granularity:
          type: per_grouped_channel
          axis: 0
          group_size: 32
  module_type_configs:
    torch.nn.modules.sparse.Embedding: null
    coreai_models.primitives.ios.embedding.LoadEmbeddings: null
