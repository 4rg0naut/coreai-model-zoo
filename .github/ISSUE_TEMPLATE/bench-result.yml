name: Benchmark result
description: Submit a result blob from the CoreAI Zoo app's Bench tab (community field data)
title: "[bench] "
labels: ["bench-result"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing a device row! Paste the JSON blob produced by the
        **Bench tab** of the [CoreAI Zoo](https://apps.apple.com/us/app/coreai-zoo/id6780135339)
        app (App Store, 2.0 or later) below — nothing else is needed. The app measures
        and builds the blob; hand-edited numbers are rejected by the aggregator.
        Results land in [BENCHMARKS.md](../blob/main/BENCHMARKS.md) on the next
        aggregation run.
  - type: textarea
    id: blob
    attributes:
      label: Result blob (JSON)
      description: Paste the blob exactly as the app produced it (Copy / Share / Submit button).
      render: json
    validations:
      required: true
