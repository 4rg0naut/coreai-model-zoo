# Simulation-only variant of minicpm5_mixed_4bit_8bit_g32.yaml: the nine 8-bit layers palettized per 32 output
# channels (the shape whose 1B arm passed the S1 gate) instead of per-tensor, to test whether the per-tensor
# 8-bit LUT is what hurts the mixed arm.
kmeans_palettization_config:
  global_config:
    op_state_spec:
      weight:
        n_bits: 4
        granularity:
          type: per_grouped_channel
          axis: 0
          group_size: 32
  module_type_configs:
    torch.nn.modules.sparse.Embedding: null
    coreai_models.primitives.ios.embedding.LoadEmbeddings: null
  module_name_configs:
    'extend\.model\.layers\.(1|6|7|8|10|11|16|40|41)\.(self_attn|mlp)\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)':
      op_state_spec:
        weight:
          n_bits: 8
          granularity:
            type: per_grouped_channel
            axis: 0
            group_size: 32
