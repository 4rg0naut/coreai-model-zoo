# S5 candidate (simulation first): 6-bit k-means g8 base + every layer that flips a margin-clear sky step when it alone
# is palettized at 6-bit g8 (scan_layer_sensitivity.py --engine coreai-opt --n-bits 6: 5 layers = 5, 7, 9, 16, 22)
# at 8-bit per 32 output channels. Estimated weights on disk ~1.77 GB (6-bit 2B = 1.70 GB runs, 8-bit 2.16 GB does not).
kmeans_palettization_config:
  global_config:
    op_state_spec:
      weight:
        n_bits: 6
        granularity:
          type: per_grouped_channel
          axis: 0
          group_size: 8
  module_type_configs:
    torch.nn.modules.sparse.Embedding: null
    coreai_models.primitives.ios.embedding.LoadEmbeddings: null
  module_name_configs:
    'extend\.model\.layers\.(5|7|9|16|22)\.(self_attn|mlp)\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)':
      op_state_spec:
        weight:
          n_bits: 8
          granularity:
            type: per_grouped_channel
            axis: 0
            group_size: 32
