# Recipe for minicpm5-2b — the configuration that produced each published bundle.
# Schema and the rules for `status`: ../README.md.
# Run it with:  python3 ../../conversion/zoo_convert.py run <name>

["minicpm5-2b"]
script = "export_minicpm5.py"
args = ["--hf-id", "openbmb/MiniCPM5-2B", "--qconfig", "minicpm5_int8sym_b32.yaml"]
card = "README.md"
hf_repo = "mlboydaisuke/MiniCPM5-2B-CoreAI"
source_hf_id = "openbmb/MiniCPM5-2B"
bundle = "int8"
status = "verified"
overlay = true
needs = [
  "Two one-time coreai_models edits, both in conversion/overlay/: registry",
  "MODEL_TYPE_REMAPPING llama -> mistral, and an AIModelMetadataFields entry for",
  "openbmb/MiniCPM5-2B (export/metadata.py).",
]
notes = [
  "Same wrapper as minicpm5-1b, one yaml apart: the stock exporter runs as",
  "`uv run coreai.llm.export openbmb/MiniCPM5-2B --experimental --compute-precision float16",
  "--compression-config minicpm5_int8sym_b32.yaml` (int8 symmetric PER-BLOCK-32 — the 1B ships",
  "per-channel; on the 2B per-channel flipped a 0.245-margin greedy token and decoded 5x slower on",
  "the Mac GPU, see the card), then rewrites the bundle's eos_token to",
  "<|im_end|> (the engine stops on a single eosTokenId; a chat bundle that declares </s>",
  "never halts). models/minicpm5-2b/verify.toml declares that.",
  "Plain LlamaForCausalLM (42 layers x hidden 2048, GQA 16:2, head_dim 128, untied",
  "130560-vocab head) — identical shape family to the 1B, so it rides the stock exporter.",
]

["minicpm5-2b-ane"]
script = "export_minicpm5.py"
args = ["--hf-id", "openbmb/MiniCPM5-2B", "--ios-ane", "--qconfig", "minicpm5_pal6_g8.yaml"]
card = "README.md"
hf_repo = "mlboydaisuke/MiniCPM5-2B-CoreAI"
source_hf_id = "openbmb/MiniCPM5-2B"
bundle = "ios-ane-h18p"
status = "verified"
overlay = true
needs = [
  "Same two overlay edits as minicpm5-2b (llama -> mistral remap; metadata entry). The iOS Mistral",
  "builder and the k-means palettizer are Apple's stock code (models/ios/mistral.py, export/presets.py).",
  "AOT needs the Xcode 27.0 RC toolchain (coreai-build 3600.83.1) — the script sets DEVELOPER_DIR.",
]
notes = [
  "The Neural Engine lane. 2026-09-16 (S5): 6-bit k-means palettization, group 8 — the shape of Apple's own iOS",
  "preset for Qwen3-1.7B (conversion/minicpm5_pal6_g8.yaml) — via `coreai.llm.export --platform iOS",
  "--compression-config minicpm5_pal6_g8.yaml --max-context-length 4096` (static graphs prompt_opt/extend",
  "{256..4096} x {8,16,64}, embeddings int8) then `xcrun coreai-build compile --platform iOS",
  "--preferred-compute neural-engine --architecture h18p` -> 31/31 ANE regions, 2.5 GB (weights 1.70 GB).",
  "Runs through the unmodified Apple main StaticShapeEngine (EngineFactory auto-detects chunkedStatic).",
  "Device gate (4 prompts incl. a 109-token free-form answer, fp32 oracle, teacher-forced + free-run): natural",
  "24/24, chat 8/8 incl. the stop, long 16/16; the long answer is exact for 33 tokens then diverges on a",
  "0.168-margin step (5 of 109 teacher-forced steps differ) — models/minicpm5-2b/gate-minicpm5-2b-ane-6bit-device.json.",
  "Speed (iPhone 17 Pro, thermal-recovered, p128 g256, 60 s): decode 38.5 tok/s, prefill 1679; GPU int8 23.8 in the",
  "same run — bench-iphone-ane-6bit-vs-gpu-2026-09-16.json. First load builds the ANE programs: 1406 s (then 0.2 s).",
  "Replaced the 2026-09-15 bundle = Apple's iOS default 4-bit g32 (1.4 GB, ~55 tok/s): it passed the 3 short",
  "prompts (gate-minicpm5-2b-ane-device.json) but diverges from fp32 at step 0 of the long answer",
  "(fidelity-probe-sky-2026-09-16.json). Apple's mixed 4/8 shape fails like 4-bit; 4-bit g8 does not compile",
  "for the ANE; 8-bit (2.16 GB) loads but never returns — knowledge/ane-vs-gpu-iphone-2026-09.md §9.",
  "`ios-static/` on HF is the same 6-bit export before AOT (the portable IR: compile it yourself for another chip).",
]
open_questions = [
  "Not enrolled in the kit catalog yet (the kit's ChatSession has no ios-ane variant path).",
  "No task-accuracy gate (e.g. GSM8K) has been run on the device bundle; the fidelity claim is the fp32",
  "token-match gate above. The 23-minute first load is the ANE program build; a pre-seeded cache in the app",
  "container makes it 0.06 s (knowledge §9b) but is 1.4-1.7 GB per OS build.",
]
